meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Save time during development
    # Enable for sign-off

    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null
    #KLayout.DRC: null

DESIGN_NAME: mesh_tile
VERILOG_FILES:
  - dir::../../src/mesh_psi_aan/mesh_tile.v
  - dir::../../src/mesh_psi_aan/mesh_router.v
  - dir::../../src/serv/rtl/*.v 
  - dir::../../src/serv/servile/*.v
  - dir::../../src/sram2048x8_gf180.v
  - dir::../../src/subservient/rtl/subservient_core.v
  - dir::../../src/subservient/rtl/subservient_rf_ram_if.v


# What should the clock port be?
CLOCK_PORT: clk
CLOCK_PERIOD: 25

VDD_NETS:
  - VDD
GND_NETS:
  - VSS

FP_SIZING: absolute
# Sized for 4×4 chip-level integration in core 3048×4234 µm.
# 4 × 730 + 3 × 42  = 3046  (col channels = 42 µm)
# 4 × 920 + 3 × 158 = 4234 (row channels very comfortable)
#
# Height history: 820 → 880 → 920. Bumped because making TILE_ID a runtime
# port (needed for hierarchical correctness) disabled constant-propagation
# through the router comparisons, growing buffer count 359 → ~585. At
# 880 µm we were 4 cells shy of legalization (67.6% utilization). 920 µm
# gives a comfortable cushion.
DIE_AREA: [0, 0, 730, 920]
CORE_AREA: [10, 10, 720, 910]

# Bumped 35 → 50 → 60 → 65 across iterations. With TILE_ID as a runtime port
# the natural placement density measured ~0.643, so 0.65 lets GPL pack
# decisively instead of trying to spread cells it can't actually spread.
PL_TARGET_DENSITY_PCT: 65

# Macro halo: 0. The gf180mcu_ocd_ip_sram__sram1024x8m8wm1 LEF already includes
# its own keep-out boundary; adding extra LibreLane halo was blocking the
# repair-pass buffers from sitting close to the SRAM pins, where their
# high-fanout signals actually need to land.
FP_MACRO_HORIZONTAL_HALO: 0
FP_MACRO_VERTICAL_HALO: 0

PDN_CORE_RING: False


# Fix 1: Core ring overflow → PDN-0239 → PSM-0069
# Die-to-core gap is 10µm. Ring needs offset + width + spacing + width.
# PDK default offset=6 → 6+1.6+1.7+1.6=10.9µm which overflows by 0.9µm.
# Reducing offset to 3 → 3+1.6+1.7+1.6=7.9µm fits within the 10µm gap.
#PDN_CORE_RING_VOFFSET: 3
#PDN_CORE_RING_HOFFSET: 3

# specify both vertical m2 and horizonstal m3 stripes to the stdcell grid
PDN_MULTILAYER: true

# Extend PDN stripes to the tile boundary (not just to the edge of the stdcell
# placement area). REQUIRED for hierarchical integration: at chip level, chip's
# Metal4 verticals stop at the macro boundary; the tile's pins must reach all
# the way to the same boundary so they abut and electrically connect.
# Without this, pins are inset ~11 µm and chip straps can't reach them
# (causes PSM-0039 "Unconnected instance VDD" on every tile_inst).
PDN_EXTEND_TO: boundary

PDN_ENABLE_PINS: True
# Tile PDN layer scheme: kept at PDK defaults (Metal4 vertical / Metal5
# horizontal). Power pins are exposed on the tile boundary by PDN_ENABLE_PINS
# + PDN_EXTEND_TO: boundary, above. This produced clean tile-level signoff
# in RUN_2026-06-01_10-41-09. Chip-level integration on top of this tile
# is the open question being investigated; do not change this section
# without revisiting that investigation.
#PDN_VERTICAL_LAYER: Metal2
#PDN_HORIZONTAL_LAYER: Metal3

# width of vertical and horizontal straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5

# distance between straps - was 90
PDN_VPITCH: 75
PDN_HPITCH: 75

VERILOG_POWER_DEFINE: "USE_POWER_PINS"


# shift stripes to the right
#PDN_VOFFSET: 10

# [Metal1, Metal2, Metal3, Metal4, Metal5]
#GRT_LAYER_ADJUSTMENTS: [0, 0.4, 0, 0, 0]

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10

# Will try and reroute antennas that are within 10% of a violation
#DRT_ANTENNA_MARGIN: 10 # %

# Space inbetween VSS and VDD pairs
PDN_VSPACING: 1
PDN_HSPACING: 1



# blocks signal routing in a specific spot
#ROUTING_OBSTRUCTIONS:
#  - ["Metal2", 567.6, 10, 569.5, 840]

EXTRA_EXCLUDED_CELLS:
  - "gf180mcu_as_sc_mcu7t3v3__buff_2"
  - "gf180mcu_as_sc_mcu7t3v3__buff_8"
  - "gf180mcu_as_sc_mcu7t3v3__buff_4"
  - "gf180mcu_as_sc_mcu7t3v3__clkbuff_8"

# include file for specifying pin locations
FP_PIN_ORDER_CFG: dir::pin_order.cfg


MACROS:
  gf180mcu_ocd_ip_sram__sram1024x8m8wm1:
    gds:
      - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.gds
    lef:
      - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.lef
    vh:
      - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.blackbox.v
    lib:
      "*_tt_025C_3v30":
        - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ff_n40C_3v60.lib
    instances:
      # Repositioned for 730×820 tile.
      # Each SRAM is 301.3 µm wide × 515.8 µm tall.
      # bank0: x=40..341, bank1: x=385..686 → 44 µm right margin, 44 µm gap between banks,
      # 40 µm left margin. The 44 µm gap is wide enough for stdcell columns (was 18 µm before,
      # which was unusable and caused DPL-0036 from layout fragmentation).
      sram2048.u_bank0:
        location: [40, 80]
        orientation: N
      sram2048.u_bank1:
        location: [385, 80]
        orientation: N

PDN_MACRO_CONNECTIONS:
  - "sram2048.u_bank0 VDD VSS VDD VSS"
  - "sram2048.u_bank1 VDD VSS VDD VSS"


PDN_CFG: dir::pdn_cfg.tcl

# Don't error on DRC for the small block during development
ERROR_ON_MAGIC_DRC: False




