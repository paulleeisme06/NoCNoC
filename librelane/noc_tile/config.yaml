meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Save time during development
    # Enable for sign-off

    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null
    #KLayout.DRC: null

DESIGN_NAME: mesh_tile
VERILOG_FILES:
  - dir::../../src/mesh_psi_aan/mesh_tile.v
  - dir::../../src/mesh_psi_aan/mesh_router.v
  - dir::../../src/serv/rtl/*.v 
  - dir::../../src/serv/servile/*.v
  - dir::../../src/subservient/rtl/sram2048x8_gf180.v
  - dir::../../src/subservient/rtl/subservient_core.v
  - dir::../../src/subservient/rtl/subservient_rf_ram_if.v


# What should the clock port be?
CLOCK_PORT: clk
CLOCK_PERIOD: 25

VDD_NETS:
  - VDD
GND_NETS:
  - VSS

FP_SIZING: absolute
DIE_AREA: [0, 0, 780, 780]
CORE_AREA: [10, 10, 770, 770]

# increase for more logic
PL_TARGET_DENSITY_PCT: 35

PDN_CORE_RING: False


# Fix 1: Core ring overflow → PDN-0239 → PSM-0069
# Die-to-core gap is 10µm. Ring needs offset + width + spacing + width.
# PDK default offset=6 → 6+1.6+1.7+1.6=10.9µm which overflows by 0.9µm.
# Reducing offset to 3 → 3+1.6+1.7+1.6=7.9µm fits within the 10µm gap.
#PDN_CORE_RING_VOFFSET: 3
#PDN_CORE_RING_HOFFSET: 3

# specify both vertical m2 and horizonstal m3 stripes to the stdcell grid
PDN_MULTILAYER: true

# extend pdn stripes to the boundary of the die instead of the edge of stdcell placement area
# Required: chip-top straps stop at the tile die boundary; without this the tile's straps
# are inset 10 µm inside the core area and there is a physical gap → PSM-0069 at chip level.
PDN_EXTEND_TO: boundary

PDN_ENABLE_PINS: True
#PDN_VERTICAL_LAYER: Metal2
#PDN_HORIZONTAL_LAYER: Metal3

# width of vertical and horizontal straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5

# distance between straps - was 90
PDN_VPITCH: 75
PDN_HPITCH: 75

VERILOG_POWER_DEFINE: "USE_POWER_PINS"


# shift stripes to the right
#PDN_VOFFSET: 10

# [Metal1, Metal2, Metal3, Metal4, Metal5]
#GRT_LAYER_ADJUSTMENTS: [0, 0.4, 0, 0, 0]

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10

# Will try and reroute antennas that are within 10% of a violation
#DRT_ANTENNA_MARGIN: 10 # %

# Space inbetween VSS and VDD pairs
PDN_VSPACING: 1
PDN_HSPACING: 1



# blocks signal routing in a specific spot
#ROUTING_OBSTRUCTIONS:
#  - ["Metal2", 567.6, 10, 569.5, 840]

EXTRA_EXCLUDED_CELLS:
  - "gf180mcu_as_sc_mcu7t3v3__buff_2"
  - "gf180mcu_as_sc_mcu7t3v3__buff_8"
  - "gf180mcu_as_sc_mcu7t3v3__buff_4"
  - "gf180mcu_as_sc_mcu7t3v3__clkbuff_8"

# include file for specifying pin locations
FP_PIN_ORDER_CFG: dir::pin_order.cfg


MACROS:
  gf180mcu_ocd_ip_sram__sram1024x8m8wm1:
    gds:
      - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.gds
    lef:
      - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.lef
    vh:
      - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1.blackbox.v
    lib:
      "*_tt_025C_3v30":
        - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::../../libs/gf180mcu_ocd_ip_sram/cells/gf180mcu_ocd_ip_sram__sram1024x8m8wm1/gf180mcu_ocd_ip_sram__sram1024x8m8wm1__ff_n40C_3v60.lib
    instances:
      sram2048.u_bank0:
        location: [80, 80]
        orientation: N
      sram2048.u_bank1:
        location: [401, 80]
        orientation: N

PDN_MACRO_CONNECTIONS:
  - "sram2048.u_bank0 VDD VSS VDD VSS"
  - "sram2048.u_bank1 VDD VSS VDD VSS"


PDN_CFG: dir::pdn_cfg.tcl

# Don't error on DRC for the small block during development
ERROR_ON_MAGIC_DRC: False




