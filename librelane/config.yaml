meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
# Hierarchical flow: chip-level only elaborates what lives OUTSIDE the
# hardened mesh_tile macro. The tile's internals (mesh_router, sram2048
# wrapper, SERV core, subservient, etc.) are blackboxed via
# hard_tile/vh/mesh_tile.vh (declared in the MACROS section below).
# Including those files here would either conflict with the blackbox or
# uselessly elaborate code that the chip will never re-synthesize.
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/mesh_psi_aan/mesh_rxc.v
- dir::../src/mesh_psi_aan/boot_controller.v
- dir::../src/dft_ethan/spi_debug.v


# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Skip every fill / tap / decap cell from the 3.3V SCL and IO libraries
# during LVS. The 3.3V flow inserts hundreds of thousands of fillcap_16
# / tap_2 cells; netgen's partition refinement does not converge in
# reasonable time at that scale. These cells connect only to power /
# ground rails, so dropping them does not affect LVS coverage.
LVS_IGNORE_CELLS:
  # 3.3V standard-cell library
  - gf180mcu_as_sc_mcu7t3v3__fill_1
  - gf180mcu_as_sc_mcu7t3v3__fill_2
  - gf180mcu_as_sc_mcu7t3v3__fill_4
  - gf180mcu_as_sc_mcu7t3v3__fill_8
  - gf180mcu_as_sc_mcu7t3v3__fillcap_4
  - gf180mcu_as_sc_mcu7t3v3__fillcap_8
  - gf180mcu_as_sc_mcu7t3v3__fillcap_16
  - gf180mcu_as_sc_mcu7t3v3__tap_2
  # IO library fill cells
  - gf180mcu_fd_io__fill1
  - gf180mcu_fd_io__fill5
  - gf180mcu_fd_io__fill10
  - gf180mcu_fd_io__fillnc

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 25 # Was set to 40 for previous run

# Fix hold violations
# pre placement slack margin to guide hold buffer insertion; set to 0.0 for no margin, or a positive value to allow hold buffers even if they cause a minor hold violation.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.7 # Was set to 0.7
# post placement slack margin to guide hold buffer insertion; set to 0.0 for no margin, or a positive value to allow hold buffers even if they cause a minor hold violation.
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.6 # Was set to 0.6
# makes sure everything is passing with the positive 0.6 of hold slack

# Allow hold buffers even if they cause a minor setup violation.
# Hold violations are dead-on-arrival; setup violations only reduce max frequency.
# Fix hold time violations no matter what, even if it causes a minor setup violation.
# set up time violations can be fixed by manually adjusting the clock period constraint and re-running STA, but hold time violations are much more difficult to fix manually.
PL_RESIZER_ALLOW_SETUP_VIOS: True
GRT_RESIZER_ALLOW_SETUP_VIOS: True

# Clock tree synthesis: cluster sinks more tightly to cut skew.
# Worst hold path showed -0.451ns skew, 2.1ns clock network delay across 12815 sinks.
# Tighter clustering reduces inter-sink skew so hold buffers can close the gap.
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 40

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells and SRAMs
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# 3.3V SRAMs (based on foundry SRAM layout)
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "nmos_3p3*"
- "pmos_5p0*"
- "pmos_1p2*"
- "pmos_3p3*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# SRAM internal cells that may contain DUALGATE layers
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

LVS_INCLUDE_MARCO_NETLISTS: True

MACROS:
  gf180mcu_ws_ip__id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
    instances:
      chip_id:
        location: [26, 26]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
        orientation: N

  # NOTE: the gf180mcu_ocd_ip_sram__sram1024x8m8wm1 macros are no longer placed
  # at chip level — they live inside the hardened mesh_tile macro below.

  mesh_tile:
    gds:
      - dir::hard_tile/gds/mesh_tile.gds
    lef:
      - dir::hard_tile/lef/mesh_tile.lef
    # The RTL source serves as the blackbox header so Verilator and
    # synthesis pick up the correct interface (incl. USE_POWER_PINS).
    vh:
      - dir::hard_tile/vh/mesh_tile.vh
    nl:
      - dir::hard_tile/nl/mesh_tile.nl.v
    spef:
      "min_*":
        - dir::hard_tile/spef/min/mesh_tile.min.spef
      "nom_*":
        - dir::hard_tile/spef/nom/mesh_tile.nom.spef
      "max_*":
        - dir::hard_tile/spef/max/mesh_tile.max.spef
    lib:
      "*_tt_025C_3v30":
        - dir::hard_tile/lib/nom_tt_025C_3v30/mesh_tile__nom_tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::hard_tile/lib/nom_ff_n40C_3v60/mesh_tile__nom_ff_n40C_3v60.lib
    instances:
      # 4 cols × 4 rows = 16 tiles. Each tile is 730 × 920 µm.
      # IMPORTANT: col/row strides are MULTIPLES of PDN_VPITCH/HPITCH (75 µm)
      # so every tile's Metal4 vertical pin (offset 23.9 in tile-local) and
      # Metal5 horizontal pin (offset 25.91) lands on the chip's PDN grid.
      # If the strides aren't multiples of 75, only some tiles align and the
      # rest report PSM-0039 "Unconnected instance VDD".
      #
      # X = 442 + col × 750  (730 tile + 20 µm channel; 750 = 10 × 75 µm)
      # Y = 542 + row × 975  (920 tile + 55 µm channel; 975 = 13 × 75 µm)
      # Bottom margin: 100 µm  | Top margin: 290 µm
      # Right edge col 3: 3422 (R = 68 µm)  | Top edge row 3: 4387 (T = 290 µm)
      i_chip_core.u_mesh.rows[0].cols[0].tile_inst: { location: [442,  542], orientation: N }
      i_chip_core.u_mesh.rows[0].cols[1].tile_inst: { location: [1192, 542], orientation: N }
      i_chip_core.u_mesh.rows[0].cols[2].tile_inst: { location: [1942, 542], orientation: N }
      i_chip_core.u_mesh.rows[0].cols[3].tile_inst: { location: [2692, 542], orientation: N }
      i_chip_core.u_mesh.rows[1].cols[0].tile_inst: { location: [442,  1517], orientation: N }
      i_chip_core.u_mesh.rows[1].cols[1].tile_inst: { location: [1192, 1517], orientation: N }
      i_chip_core.u_mesh.rows[1].cols[2].tile_inst: { location: [1942, 1517], orientation: N }
      i_chip_core.u_mesh.rows[1].cols[3].tile_inst: { location: [2692, 1517], orientation: N }
      i_chip_core.u_mesh.rows[2].cols[0].tile_inst: { location: [442,  2492], orientation: N }
      i_chip_core.u_mesh.rows[2].cols[1].tile_inst: { location: [1192, 2492], orientation: N }
      i_chip_core.u_mesh.rows[2].cols[2].tile_inst: { location: [1942, 2492], orientation: N }
      i_chip_core.u_mesh.rows[2].cols[3].tile_inst: { location: [2692, 2492], orientation: N }
      i_chip_core.u_mesh.rows[3].cols[0].tile_inst: { location: [442,  3467], orientation: N }
      i_chip_core.u_mesh.rows[3].cols[1].tile_inst: { location: [1192, 3467], orientation: N }
      i_chip_core.u_mesh.rows[3].cols[2].tile_inst: { location: [1942, 3467], orientation: N }
      i_chip_core.u_mesh.rows[3].cols[3].tile_inst: { location: [2692, 3467], orientation: N }

# Hierarchical: connect each hardened mesh_tile macro's VDD/VSS pins
# to the chip-level VDD/VSS nets. (SRAM banks live inside the tile now.)
# 16 entries for the 4×4 mesh.
#
# Patterns: a leading ".*" absorbs the Verilog-escaped-identifier "\" that
# prefixes generate-block instance names (Yosys writes them as e.g.
# "\i_chip_core.u_mesh.rows[0].cols[0].tile_inst "). Brackets are matched
# with "." (any-char) — escaped brackets get mangled through Tcl list
# canonicalization and don't match here. The patterns are still anchored
# (^...$ added by set_global_connections.tcl) and the dots have a fixed
# count, so each line matches exactly one tile instance.
PDN_MACRO_CONNECTIONS:
- "i_chip_core.u_mesh.rows..0...cols..0...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..0...cols..1...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..0...cols..2...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..0...cols..3...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..1...cols..0...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..1...cols..1...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..1...cols..2...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..1...cols..3...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..2...cols..0...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..2...cols..1...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..2...cols..2...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..2...cols..3...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..3...cols..0...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..3...cols..1...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..3...cols..2...tile_inst VDD VSS VDD VSS"
- "i_chip_core.u_mesh.rows..3...cols..3...tile_inst VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
# PDN halos restored to 5: with tile exposing power on Metal2/Metal3 and
# tile internal routing limited to Metal3, chip's Metal4/5 straps now pass
# THROUGH the tile region freely (no OBS conflict). A small halo just keeps
# vias from packing too close to the macro boundary.
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_cfg.tcl
