  mesh_tile:
    gds:
      - dir::hard_tile/gds/mesh_tile.gds
    lef:
      - dir::hard_tile/lef/mesh_tile.lef
    vh:
      - dir::hard_tile/vh/mesh_tile.vh
    nl:
      - dir::hard_tile/nl/mesh_tile.nl.v
    spef:
      "max_*":
        - dir::hard_tile/spef/max/mesh_tile.max.spef
      "min_*":
        - dir::hard_tile/spef/min/mesh_tile.min.spef
      "nom_*":
        - dir::hard_tile/spef/nom/mesh_tile.nom.spef
    lib:
      "*_tt_025C_3v30":
        - dir::hard_tile/lib/nom_tt_025C_3v30/mesh_tile__nom_tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::hard_tile/lib/nom_ff_n40C_3v60/mesh_tile__nom_ff_n40C_3v60.lib
    instances:
      # 3x3 grid of 780x780um tiles.
      # Row y positions chosen so the first chip PDN Metal5 stripe enters the tile ~47um
      # from the tile bottom (same depth as working row1). This ensures Via4 is placed
      # for both VDD and VSS. Each row's chip VDD stripe lands 21um above the tile VDD
      # Metal5 pin (non-blocking), with chip VSS 52um from the tile bottom.
      # Row2=970, Row1=2170, Row0=3445. Gaps: core↔r2=527um, r2↔r1=420um, r1↔r0=495um, r0↔core=452um.
      # Row index 0 = northernmost (highest y), row index 2 = southernmost (lowest y).
      # RTL: north_in of rows[r] = south_out of rows[r-1], so lower r is physically above.
      "i_chip_core.u_mesh.rows[0].cols[0].tile_inst":
        location: [619, 3445]
        orientation: N
      "i_chip_core.u_mesh.rows[0].cols[1].tile_inst":
        location: [1576, 3445]
        orientation: N
      "i_chip_core.u_mesh.rows[0].cols[2].tile_inst":
        location: [2533, 3445]
        orientation: N
      "i_chip_core.u_mesh.rows[1].cols[0].tile_inst":
        location: [619, 2170]
        orientation: N
      "i_chip_core.u_mesh.rows[1].cols[1].tile_inst":
        location: [1576, 2170]
        orientation: N
      "i_chip_core.u_mesh.rows[1].cols[2].tile_inst":
        location: [2533, 2170]
        orientation: N
      "i_chip_core.u_mesh.rows[2].cols[0].tile_inst":
        location: [619, 970]
        orientation: N
      "i_chip_core.u_mesh.rows[2].cols[1].tile_inst":
        location: [1576, 970]
        orientation: N
      "i_chip_core.u_mesh.rows[2].cols[2].tile_inst":
        location: [2533, 970]
        orientation: N

# This is an alternative method compared to
# specifying the power connections in the RTL
PDN_MACRO_CONNECTIONS:
# Match all 9 mesh_tile instances with a single wildcard regex.
# Avoids bracket-escaping issues with generate-block instance names.
- ".*tile_inst VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_cfg.tcl
