meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
# Top-level and core
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
# Host SPI slave (11-bit addr, unicast+broadcast write, readback, reset control)
- dir::../src/flash_Sumi/host_spi_slave.v
# Integration mesh (boot_controller + 9 tiles + host bus + readback mux)
- dir::../src/integration/mesh_3x3.v
- dir::../src/integration/mesh_tile.v
- dir::../src/integration/mesh_router.v
- dir::../src/integration/boot_controller.v
# Subservient RISC-V core (used inside each mesh_tile)
- dir::../src/subservient/ethan/subservient_core.v
- dir::../src/subservient/ethan/subservient_rf_ram_if.v
# SERV bit-serial RISC-V RTL (dependency of subservient_core)
- dir::../src/serv/rtl/serv_alu.v
- dir::../src/serv/rtl/serv_bufreg.v
- dir::../src/serv/rtl/serv_bufreg2.v
- dir::../src/serv/rtl/serv_compdec.v
- dir::../src/serv/rtl/serv_csr.v
- dir::../src/serv/rtl/serv_ctrl.v
- dir::../src/serv/rtl/serv_decode.v
- dir::../src/serv/rtl/serv_immdec.v
- dir::../src/serv/rtl/serv_mem_if.v
- dir::../src/serv/rtl/serv_rf_if.v
- dir::../src/serv/rtl/serv_rf_ram_if.v
- dir::../src/serv/rtl/serv_rf_ram.v
- dir::../src/serv/rtl/serv_rf_top.v
- dir::../src/serv/rtl/serv_state.v
- dir::../src/serv/rtl/serv_top.v
- dir::../src/serv/rtl/serv_aligner.v
- dir::../src/serv/servile/servile_arbiter.v
- dir::../src/serv/servile/servile_mux.v
- dir::../src/serv/servile/servile_rf_mem_if.v
- dir::../src/serv/servile/servile.v
- dir::../src/serv/servile/*.v


# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 40 # 25 MHz

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.35
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells and SRAMs
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# 3.3V SRAMs (based on foundry SRAM layout)
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "nmos_3p3*"
- "pmos_5p0*"
- "pmos_1p2*"
- "pmos_3p3*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# SRAM internal cells that may contain DUALGATE layers
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

MACROS:
  gf180mcu_ws_ip__id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
    instances:
      chip_id:
        location: [26, 26]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
        orientation: N

  # Each mesh_tile instantiates gf180mcu_fd_ip_sram__sram2048x8m8wm1.
  # There are 9 tiles (rows 0-2, cols 0-2); instance paths follow the generate
  # block naming: i_chip_core.u_mesh.rows[R].cols[C].tile_inst.sram_inst
  # GDS/LEF/LIB paths below assume the standard GF180MCU PDK layout.
  # Run `make clone-pdk` and verify these paths before tapeout.
  gf180mcu_fd_ip_sram__sram2048x8m8wm1:
    gds:
      - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram2048x8m8wm1.gds
    lef:
      - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram2048x8m8wm1.lef
    vh:
      - dir::../src/subservient/ethan/gf180mcu_fd_ip_sram__sram2048x8m8wm1.v
    lib:
      "*_tt_025C_3v30":
        - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram2048x8m8wm1__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::../gf180mcu/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram2048x8m8wm1__ff_n40C_3v60.lib
    instances:
      # TODO: determine final floorplan locations for all 9 tile SRAMs.
      # Placeholder locations below — update before running LibreLane.
      i_chip_core.u_mesh.rows[0].cols[0].tile_inst.sram_inst:
        location: [200, 200]
        orientation: N
      i_chip_core.u_mesh.rows[0].cols[1].tile_inst.sram_inst:
        location: [500, 200]
        orientation: N
      i_chip_core.u_mesh.rows[0].cols[2].tile_inst.sram_inst:
        location: [800, 200]
        orientation: N
      i_chip_core.u_mesh.rows[1].cols[0].tile_inst.sram_inst:
        location: [200, 500]
        orientation: N
      i_chip_core.u_mesh.rows[1].cols[1].tile_inst.sram_inst:
        location: [500, 500]
        orientation: N
      i_chip_core.u_mesh.rows[1].cols[2].tile_inst.sram_inst:
        location: [800, 500]
        orientation: N
      i_chip_core.u_mesh.rows[2].cols[0].tile_inst.sram_inst:
        location: [200, 800]
        orientation: N
      i_chip_core.u_mesh.rows[2].cols[1].tile_inst.sram_inst:
        location: [500, 800]
        orientation: N
      i_chip_core.u_mesh.rows[2].cols[2].tile_inst.sram_inst:
        location: [800, 800]
        orientation: N

# This is an alternative method compared to
# specifying the power connections in the RTL
PDN_MACRO_CONNECTIONS:
- "i_chip_core.sram_0 VDD VSS VDD VSS"
- "i_chip_core.sram_1 VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

PDN_CFG: dir::pdn_cfg.tcl
