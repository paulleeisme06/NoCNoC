meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
# Hierarchical flow: chip-level only elaborates what lives OUTSIDE the
# hardened mesh_tile macro. The tile's internals (mesh_router, sram2048
# wrapper, SERV core, subservient, etc.) are blackboxed via
# hard_tile/vh/mesh_tile.vh (declared in the MACROS section below).
# Including those files here would either conflict with the blackbox or
# uselessly elaborate code that the chip will never re-synthesize.
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/mesh_psi_aan/mesh_rxc.v
- dir::../src/mesh_psi_aan/boot_controller.v
- dir::../src/dft_ethan/spi_debug.v


# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']

# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo

# Skip every fill / tap / decap cell from the 3.3V SCL and IO libraries
# during LVS. The 3.3V flow inserts hundreds of thousands of fillcap_16
# / tap_2 cells; netgen's partition refinement does not converge in
# reasonable time at that scale. These cells connect only to power /
# ground rails, so dropping them does not affect LVS coverage.
LVS_IGNORE_CELLS:
  # 3.3V standard-cell library
  - gf180mcu_as_sc_mcu7t3v3__fill_1
  - gf180mcu_as_sc_mcu7t3v3__fill_2
  - gf180mcu_as_sc_mcu7t3v3__fill_4
  - gf180mcu_as_sc_mcu7t3v3__fill_8
  - gf180mcu_as_sc_mcu7t3v3__fillcap_4
  - gf180mcu_as_sc_mcu7t3v3__fillcap_8
  - gf180mcu_as_sc_mcu7t3v3__fillcap_16
  - gf180mcu_as_sc_mcu7t3v3__tap_2
  # IO library fill cells
  - gf180mcu_fd_io__fill1
  - gf180mcu_fd_io__fill5
  - gf180mcu_fd_io__fill10
  - gf180mcu_fd_io__fillnc

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 25 # Was set to 40 for previous run

# Resizer settings restored to the proven values from the working 3×3 chip.
# Our earlier tuning (0.1 hold margin, disabled setup buffering, etc.) was
# trying to fix DPL-0036, but the real cause of DPL failure was the BAD tile
# placement (rows[0] at bottom instead of top → NoC signals routing across
# the entire chip → global router unable to fit cells). With placement now
# fixed, we can keep the proven resizer settings.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.7
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.6
PL_RESIZER_ALLOW_SETUP_VIOS: True
GRT_RESIZER_ALLOW_SETUP_VIOS: True

# Clock tree synthesis: cluster sinks more tightly to cut skew.
# Worst hold path showed -0.451ns skew, 2.1ns clock network delay across 12815 sinks.
# Tighter clustering reduces inter-sink skew so hold buffers can close the gap.
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 40

# Target density restored to 35 (matches working 3×3 chip).
PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
# 74.48 (= 19 rows = 133 sites) — MUST match the tile's PDN pitch so the chip
# grid and the tile's M4/M5 power pins are co-aligned (the hierarchical power
# handoff). 75 was incommensurate with the macro snap grid; 74.48 is exact.
PDN_VPITCH: 74.48
PDN_HPITCH: 74.48

# Keep the M4/M5 straps running CONTINUOUSLY over the tiles instead of trimming
# them off. The tile uses M4/M5 for its own power pins (the SRAM forces M5, so it
# can't give up the top layers for the standard hierarchical method). With the
# tiles grid-aligned (placements below), an un-trimmed chip strap lands directly
# on top of the tile's same-net M4/M5 pin → solid overlap. Trimming (the default)
# removed the over-tile straps and left only fragile channel abutment: VDD barely
# connected (0.56µm gap), VSS opened (5.67µm gap) → PSM-0069 on VSS. Diagnosed
# from RUN_2026-06-03_01-35-51. (chip_id/logo macros are outside the core, so
# skip_trim only affects straps over the tiles.)
PDN_SKIPTRIM: True

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Do not error on magic DRC violations
# Note: Passing magic DRC is not required for the submission.
# However, it is recommended to fix or carefully review all violations.
ERROR_ON_MAGIC_DRC: False

# Prevent false positive DRC errors in I/O cells and SRAMs
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# 3.3V SRAMs (based on foundry SRAM layout)
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "nmos_3p3*"
- "pmos_5p0*"
- "pmos_1p2*"
- "pmos_3p3*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# SRAM internal cells that may contain DUALGATE layers
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# ignore active metal on previous and subsequent layers
# (DM.5_DM.7 and DM.4_DM.6). Dummy metal is moved to active
# metal during the precheck.
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

LVS_INCLUDE_MARCO_NETLISTS: True

MACROS:
  gf180mcu_ws_ip__id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
    instances:
      chip_id:
        location: [26, 26]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
        orientation: N

  # NOTE: the gf180mcu_ocd_ip_sram__sram1024x8m8wm1 macros are no longer placed
  # at chip level — they live inside the hardened mesh_tile macro below.

  mesh_tile:
    gds:
      - dir::hard_tile/gds/mesh_tile.gds
    lef:
      - dir::hard_tile/lef/mesh_tile.lef
    # The RTL source serves as the blackbox header so Verilator and
    # synthesis pick up the correct interface (incl. USE_POWER_PINS).
    vh:
      - dir::hard_tile/vh/mesh_tile.vh
    nl:
      - dir::hard_tile/nl/mesh_tile.nl.v
    spef:
      "min_*":
        - dir::hard_tile/spef/min/mesh_tile.min.spef
      "nom_*":
        - dir::hard_tile/spef/nom/mesh_tile.nom.spef
      "max_*":
        - dir::hard_tile/spef/max/mesh_tile.max.spef
    lib:
      "*_tt_025C_3v30":
        - dir::hard_tile/lib/nom_tt_025C_3v30/mesh_tile__nom_tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - dir::hard_tile/lib/nom_ff_n40C_3v60/mesh_tile__nom_ff_n40C_3v60.lib
    instances:
      # 3 cols × 4 rows = 12 tiles (3×4 mesh). Each tile is 730 × 920 µm.
      # Core area = [442, 442, 3490, 4680] = 3048 × 4238 µm.
      #
      # 3 columns leave generous VERTICAL channels (~329 µm) — the same roomy
      # geometry that lets the proven 3×3 route. (4 columns left only ~42 µm,
      # which is why 4×4 could not route in this fixed slot.)
      #   3 × 730 + 2 × 329 = 2848  (+ ~100 µm L/R margins = 3048) ✓
      #   4 × 920 + 3 × 159 = 4157  (+ ~40 µm T/B margins ≈ 4238) ✓
      #
      # CRITICAL: rows[0] is PHYSICALLY AT THE TOP (highest Y). The mesh RTL ties
      # north_in of rows[r] = south_out of rows[r-1], so rows[r-1] must sit above
      # rows[r]; otherwise inter-row NoC signals route across the whole chip.
      #
      # EDGE-BRIDGE placements (pitch 74.48 = 19 rows = 133 sites).
      # The tile pins never physically overlap the chip straps (trimmed at the
      # macro boundary), so the power handoff happens by a sub-micron EDGE BRIDGE:
      # a chip strap whose width grazes the tile boundary vias down to the tile's
      # perpendicular pin there. Because chip VDD/VSS straps are 6 µm apart, only
      # ONE net can bridge at any single edge. The tiles are therefore placed so
      # that each net bridges at a DIFFERENT edge:
      #   X ≡ 26.32 mod 74.48 → core M4 VDD strap grazes the tile RIGHT edge,
      #                          via to the tile's M5 VDD pin   (2.18 µm overlap)
      #   Y ≡ 66.64 mod 74.48 → core M5 VSS strap grazes the tile TOP edge,
      #                          via to the tile's M4 VSS pin   (2.17 µm overlap)
      # Both overlaps are 6× the (working) 0.33 µm VDD bridge of the old aligned
      # placement, which connected VDD but left VSS islanded (PSM-0069 on VSS).
      # VERIFIED in-session (move tiles + pdngen + check_power_grid on
      # RUN_2026-06-03_01-56-59): PSM-0040 "All shapes connected" on BOTH nets.
      # stride 1042.72 (= 14·74.48), exact site/row multiple → every tile shares
      # the same X/Y phase. Channels unchanged from the routable placement.
      # RING TILE re-tune: rows shifted +19.6 µm (+5 rows) from the non-ring
      # placement. The ring's perimeter M5 rail perturbed the original VSS
      # top-edge bridge; this offset re-aligns BOTH nets' edge-bridges to the
      # ring tile. Verified in-session (move tiles + pdngen + check_power_grid
      # on RUN_2026-06-04_22-16-02): VDD=0 and VSS=0 unconnected, and the VSS
      # bridge connects across rows +3…+13, so +5 is well inside the window.
      i_chip_core.u_mesh.rows[0].cols[0].tile_inst: { location: [547.68,  3661.28], orientation: N }
      i_chip_core.u_mesh.rows[0].cols[1].tile_inst: { location: [1590.40, 3661.28], orientation: N }
      i_chip_core.u_mesh.rows[0].cols[2].tile_inst: { location: [2633.12, 3661.28], orientation: N }
      i_chip_core.u_mesh.rows[1].cols[0].tile_inst: { location: [547.68,  2618.56], orientation: N }
      i_chip_core.u_mesh.rows[1].cols[1].tile_inst: { location: [1590.40, 2618.56], orientation: N }
      i_chip_core.u_mesh.rows[1].cols[2].tile_inst: { location: [2633.12, 2618.56], orientation: N }
      i_chip_core.u_mesh.rows[2].cols[0].tile_inst: { location: [547.68,  1575.84], orientation: N }
      i_chip_core.u_mesh.rows[2].cols[1].tile_inst: { location: [1590.40, 1575.84], orientation: N }
      i_chip_core.u_mesh.rows[2].cols[2].tile_inst: { location: [2633.12, 1575.84], orientation: N }
      i_chip_core.u_mesh.rows[3].cols[0].tile_inst: { location: [547.68,  533.12],  orientation: N }
      i_chip_core.u_mesh.rows[3].cols[1].tile_inst: { location: [1590.40, 533.12],  orientation: N }
      i_chip_core.u_mesh.rows[3].cols[2].tile_inst: { location: [2633.12, 533.12],  orientation: N }

# Hierarchical: connect every mesh_tile macro's VDD/VSS pins to chip nets.
# A single wildcard regex matches all 16 tile_inst instances at once —
# avoids the bracket-escaping issues we hit with per-tile patterns.
# (This matches the working pattern in the proven 3×3 chip config.)
PDN_MACRO_CONNECTIONS:
- ".*tile_inst VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
# PDN halos restored to 5: with tile exposing power on Metal2/Metal3 and
# Halo = 0 for the hierarchical power handoff: the tile's M5 power pins extend to
# the tile boundary (PDN_EXTEND_TO: boundary in noc_tile), and the chip's M5
# channel stripes must reach that same boundary to ABUT them. A non-zero halo
# leaves a gap (the chip grid stops short of the tile edge) → pins float →
# PSM-0069. With the rows aligned to the chip M5 grid (see placements above),
# halo 0 lets the stripes meet the pins exactly.
PDN_HORIZONTAL_HALO: 0
PDN_VERTICAL_HALO: 0

PDN_CFG: dir::pdn_cfg.tcl
