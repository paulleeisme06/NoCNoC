  version: 3
  flow: Chip
  substituting_steps:

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time during development
    # Enable for sign-off
    #OpenROAD.IRDropReport: null
    #Magic.DRC: null
    #Checker.MagicDRC: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../src/mesh_psi_aan/mesh_rxc.v
- dir::../src/mesh_psi_aan/boot_controller.v
- dir::../src/dft_ethan/spi_debug.v 
- dir::../src/host-to-chip - Paul&Andrea/host_to_chip.v 
- dir::../src/flash_Sumi/flash_clk.sv
- dir::../src/flash_Sumi/hk_boot_adapter.v
- dir::../src/flash_Sumi/housekeeping.sv
- dir::../src/flash_Sumi/shiftregister.sv
- dir::../src/flash_Sumi/rd_crossbar.v
- dir::../src/flash_Sumi/spi_arbiter.v
